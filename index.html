<!DOCTYPE html>
<html>
<head>
  <title>NextChat (beta)</title>

  <style>
    * {
      margin: 0;
      font-family: Arial;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      background: #313338;
      color: white;
    }

    /* SERVER BAR */
    .serverBar {
      width: 72px;
      background: #1e1f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 10px;
    }

    .serverIcon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .serverIcon:hover {
      border-radius: 16px;
      background: #4752c4;
    }

    /* CHAT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .top {
      height: 50px;
      background: #2b2d31;
      display: flex;
      align-items: center;
      padding: 0 15px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .input {
      display: flex;
      padding: 10px;
      background: #2b2d31;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      background: #383a40;
      color: white;
      border-radius: 6px;
    }

    button {
      margin-left: 10px;
      background: #5865F2;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    #popup {
      position: fixed;
      top: 30%;
      left: 40%;
      background: #1e1f22;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    img {
      max-width: 200px;
      border-radius: 8px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- SERVER BAR -->
<div class="serverBar">
  <div class="serverIcon" onclick="openCreate()">+</div>
  <div class="serverIcon" onclick="openJoin()">🔗</div>
  <div id="servers"></div>
</div>

<!-- CHAT -->
<div class="main">
  <div class="top" id="serverName">No server selected</div>
  <div class="chat" id="chat"></div>

  <div class="input">
    <input id="msg" placeholder="Message..." />
    <button onclick="sendMsg()">Send</button>
    <input type="file" id="img" />
    <button onclick="sendImage()">📷</button>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div id="createBox">
    <h3>Create Server</h3>
    <input id="serverInput" placeholder="Server name">
    <button onclick="createServer()">Create</button>
  </div>

  <div id="joinBox" style="display:none;">
    <h3>Join Server</h3>
    <input id="joinInput" placeholder="Server ID">
    <button onclick="joinServer()">Join</button>
  </div>

  <button onclick="closePopup()">Close</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  updateDoc,
  arrayUnion,
  collection,
  getDocs,
  onSnapshot,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCmuTFq5e9pDKZLQ4RAD61eWQCvnc9N4mo",
  authDomain: "servers-fcc29.firebaseapp.com",
  projectId: "servers-fcc29",
  storageBucket: "servers-fcc29.firebasestorage.app",
  messagingSenderId: "740801059643",
  appId: "1:740801059643:web:aff3348ea0c95ec492b51e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let user;
let currentServer = null;

/* LOGIN */
onAuthStateChanged(auth, (u) => {
  if (!u) signInWithPopup(auth, provider);
  else {
    user = u;
    loadServers();
  }
});

/* CREATE SERVER */
window.createServer = async function () {
  const id = Math.random().toString(36).substring(2, 10);

  await setDoc(doc(db, "servers", id), {
    name: document.getElementById("serverInput").value,
    owner: user.uid,
    members: [user.uid]
  });

  closePopup();
  loadServers();
};

/* JOIN SERVER + BOT */
window.joinServer = async function () {
  const id = document.getElementById("joinInput").value;

  await updateDoc(doc(db, "servers", id), {
    members: arrayUnion(user.uid)
  });

  await addDoc(collection(db, "servers", id, "messages"), {
    text: `🤖 Welcome ${user.displayName}!`,
    user: "NextBot",
    type: "text",
    time: serverTimestamp()
  });

  closePopup();
  loadServers();
};

/* LOAD SERVERS */
async function loadServers() {
  const box = document.getElementById("servers");
  box.innerHTML = "";

  const snap = await getDocs(collection(db, "servers"));

  snap.forEach((d) => {
    const data = d.data();

    if (data.members.includes(user.uid)) {
      const div = document.createElement("div");
      div.className = "serverIcon";
      div.innerText = data.name[0];

      div.onclick = () => {
        currentServer = d.id;
        document.getElementById("serverName").innerText = data.name;
        listenMessages(d.id);
      };

      box.appendChild(div);
    }
  });
}

/* REAL TIME CHAT */
function listenMessages(serverId) {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  const ref = collection(db, "servers", serverId, "messages");

  onSnapshot(ref, (snap) => {
    chat.innerHTML = "";

    snap.forEach((m) => {
      const data = m.data();

      const div = document.createElement("div");

      if (data.type === "image") {
        div.innerHTML = `<b>${data.user}:</b><br><img src="${data.text}">`;
      } else {
        div.innerHTML = `<b>${data.user}:</b> ${data.text}`;
      }

      chat.appendChild(div);
    });

    chat.scrollTop = chat.scrollHeight;
  });
}

/* SEND TEXT */
window.sendMsg = async function () {
  if (!currentServer) return;

  const msg = document.getElementById("msg").value;

  await addDoc(collection(db, "servers", currentServer, "messages"), {
    text: msg,
    user: user.displayName,
    type: "text",
    time: serverTimestamp()
  });

  document.getElementById("msg").value = "";
};

/* SEND IMAGE */
window.sendImage = async function () {
  if (!currentServer) return;

  const file = document.getElementById("img").files[0];
  if (!file) return;

  const fileRef = ref(storage, `chat/${Date.now()}`);

  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db, "servers", currentServer, "messages"), {
    text: url,
    user: user.displayName,
    type: "image",
    time: serverTimestamp()
  });
};

/* POPUPS */
window.openCreate = () => {
  document.getElementById("popup").style.display = "block";
  document.getElementById("createBox").style.display = "block";
  document.getElementById("joinBox").style.display = "none";
};

window.openJoin = () => {
  document.getElementById("popup").style.display = "block";
  document.getElementById("createBox").style.display = "none";
  document.getElementById("joinBox").style.display = "block";
};

window.closePopup = () => {
  document.getElementById("popup").style.display = "none";
};

</script>

</body>
</html>
