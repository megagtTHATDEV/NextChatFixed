<!DOCTYPE html>
<html>
<head>
  <title>NextChat (beta)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f14;
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1c1c24;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }

    button {
      background: #5865F2;
      border: none;
      padding: 12px;
      color: white;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    #app {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      padding: 20px;
    }

    .topbar {
      background: #1c1c24;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="card">
  <h1>NextChat</h1>
  <p>(beta)</p>
  <button onclick="loginWithGoogle()">Play</button>
  <p id="status">Not logged in</p>
</div>

<!-- APP SCREEN -->
<div id="app">
  <div class="topbar">
    Welcome to NextChat 🎮
    <span id="user"></span>
  </div>

  <h2>Servers will go here soon</h2>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmuTFq5e9pDKZLQ4RAD61eWQCvnc9N4mo",
    authDomain: "servers-fcc29.firebaseapp.com",
    projectId: "servers-fcc29",
    storageBucket: "servers-fcc29.firebasestorage.app",
    messagingSenderId: "740801059643",
    appId: "1:740801059643:web:aff3348ea0c95ec492b51e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("app");
  const status = document.getElementById("status");
  const userText = document.getElementById("user");

  // 🔐 LOGIN
  window.loginWithGoogle = function () {
    signInWithPopup(auth, provider)
      .then((result) => {
        console.log("Logged in");
      })
      .catch((err) => {
        status.innerText = err.message;
      });
  };

  // 👤 AUTH STATE
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // SWITCH SCREENS
      loginScreen.style.display = "none";
      appScreen.style.display = "block";

      userText.innerText = " | " + user.displayName;
    } else {
      loginScreen.style.display = "block";
      appScreen.style.display = "none";
    }
  });

</script>

</body>
</html>
